services:
  mysql:
    image: mysql:8.0
    container_name: rent_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rent_db
      MYSQL_USER: rent_user
      MYSQL_PASSWORD: rent_pass
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rent_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URI: mysql+pymysql://rent_user:rent_pass@mysql:3306/rent_db?charset=utf8mb4
      LOG_FILE_PATH: logs/app.log
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ../backend/logs:/app/backend/logs

volumes:
  mysql_data:
